<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZONE X</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial,sans-serif}
header{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #252d3b}
.logo{font-size:27px;font-weight:bold}
.logo span{color:#168cff}
nav{display:flex;justify-content:space-around;padding:16px;background:#111722}
main{max-width:600px;margin:auto;padding:15px}
.card{background:#111722;border:1px solid #293244;border-radius:15px;padding:17px;margin:15px 0}
button{background:#168cff;color:white;border:0;padding:13px 20px;border-radius:9px;font-weight:bold}
input{width:100%;padding:14px;margin:8px 0;background:#080b12;color:white;border:1px solid #39445a;border-radius:9px}
.story{display:inline-block;padding:15px;background:#18263c;border-radius:50%;margin:8px}
.small{color:#aab3c4}
</style>
</head>
<body>
<header>
<div class="logo">ZONE <span>X</span></div>
<div>🔔　✉️</div>
</header>
<nav>
<span>For You</span>
<span>Following</span>
</nav>
<main>
<div class="card">
<strong>Stories</strong><br>
<span class="story">＋</span>
<span class="story">👤</span>
<span class="story">👤</span>
<span class="story">👤</span>
</div>
<div class="card">
<h2>Welcome to ZONE X</h2>
<p class="small">Your world. Your people. Your zone.</p>
<button onclick="login()">Log In</button>
<button onclick="signup()">Sign Up</button>
</div>
<div id="account"></div>
<div class="card">
<h3>Discover your zone</h3>
<p class="small">Connect. Share. Discover.</p>
</div>
</main>
<script>
function login(){
document.getElementById('account').innerHTML=
'<div class="card"><h2>Log In</h2><input placeholder="Email or phone"><input type="password" placeholder="Password"><button>Log In</button><p>Forgot password?</p></div>';
}
function signup(){
document.getElementById('account').innerHTML=
'<div class="card"><h2>Create Account</h2><input placeholder="Full name"><input placeholder="Username"><input placeholder="Nickname"><input type="date"><input placeholder="Email or phone"><input type="password" placeholder="Create password"><input type="password" placeholder="Confirm password"><button>Create Account</button></div>';
}
</script>
</body>
</html>
